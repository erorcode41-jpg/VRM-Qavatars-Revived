name: Build VRM Qavatars (1.40.8)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      # Preferred: the QPM action installs the qpm CLI (and restores dependencies)
      - name: Setup QPM
        id: qpm-action
        continue-on-error: true
        uses: Fernthedev/qpm-action@v1
        with:
          workflow_token: ${{ secrets.GITHUB_TOKEN }}
          restore: true
          cache: true
          publish: false

      # Fallback: build qpm from source if the action failed (slow, ~5-10 min)
      - name: Fallback - install qpm with cargo
        if: steps.qpm-action.outcome != 'success'
        run: |
          if ! command -v qpm >/dev/null 2>&1; then
            cargo install --git https://github.com/QuestPackageManager/QPM.CLI --locked qpm || cargo install --git https://github.com/QuestPackageManager/QPM.CLI qpm
          fi
          qpm --version

      - name: qpm restore
        run: |
          qpm --version || true
          qpm restore
          ls -la extern || true

      - name: Configure
        run: |
          export ANDROID_NDK_HOME="${{ steps.setup-ndk.outputs.ndk-path }}"
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -B build

      - name: Build
        run: cmake --build build 2>&1 | tee build.log

      - name: Package .qmod
        run: |
          ls -la build
          bash qmod_kit/make_qmod.sh build/libvrm-qavatars.so

      - name: Upload qmod
        uses: actions/upload-artifact@v4
        with:
          name: VRM_Qavatars_Revived_qmod
          path: VRM_Qavatars_Revived_1.40.8.qmod

      - name: Upload .so
        uses: actions/upload-artifact@v4
        with:
          name: libvrm-qavatars_so
          path: build/libvrm-qavatars.so

      - name: Upload build log (for error reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            build/CMakeFiles/CMakeError.log
          if-no-files-found: ignore
